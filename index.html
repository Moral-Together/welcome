<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Moral Together projects and websites hub." />
  <meta property="og:title" content="Moral Together — Projects Hub" />
  <meta property="og:description" content="A curated gateway to Moral Together projects, websites and initiatives." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Moral Together — Projects Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Code+Pro:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <div class="color-ribbon" aria-hidden="true"></div>
    <div class="gradient-orb orb-one"></div>
    <div class="gradient-orb orb-two"></div>
    <div class="gradient-orb orb-three"></div>

    <main class="profile-card" aria-labelledby="page-title">
      <nav class="language-switcher" aria-label="Language switcher">
        <button class="lang-btn active" type="button" data-lang="en">EN</button>
        <button class="lang-btn" type="button" data-lang="he">עברית</button>
        <button class="lang-btn" type="button" data-lang="ru">RU</button>
      </nav>

      <section class="hero">
        <img
          class="brand-logo"
          src="MoralTogetherLogo.png"
          alt="Moral Together — Connecting for Goodwill"
        />
        <p class="eyebrow" data-i18n="eyebrow">Moral Together</p>
        <h1 id="page-title" data-i18n="title">Our projects</h1>
        <p class="subtitle" data-i18n="subtitle">
          A clean gateway to selected projects, digital platforms and public initiatives created around Moral Together.
        </p>
      </section>

      <section class="links" aria-label="Project links">
        <a class="project-link tone-violet" href="#" aria-label="Open Moral for Good">
          <img class="project-logo" src="logos/moral-for-good.svg" alt="" />
        </a>

        <a class="project-link tone-green" href="#" aria-label="Open Zuzim.cash">
          <img class="project-logo" src="logos/zuzim-cash.svg" alt="" />
        </a>

        <a class="project-link tone-orange" href="#" aria-label="Open Partner landing page">
          <img class="project-logo" src="logos/partner-landing.svg" alt="" />
        </a>

        <a class="project-link tone-pink" href="#" aria-label="Open Community Campaign">
          <img class="project-logo" src="logos/community-campaign.svg" alt="" />
        </a>

        <a class="project-link tone-blue" href="#" aria-label="Open Digital Services showcase">
          <img class="project-logo" src="logos/digital-services.svg" alt="" />
        </a>

        <a class="project-link tone-sun" href="#" aria-label="Open Internal projects archive">
          <img class="project-logo" src="logos/projects-archive.svg" alt="" />
        </a>
      </section>

      <section class="note" aria-label="Information note">
        <span class="status-dot"></span>
        <p data-i18n="note">
          Replace the placeholder links with final project URLs as they become available.
        </p>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer">© 2026 Moral Together. Built as a lightweight public projects hub.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
