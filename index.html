<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Moral Together projects and websites hub." />
  <meta property="og:title" content="Moral Together — Projects Hub" />
  <meta property="og:description" content="A curated gateway to Moral Together projects, websites and initiatives." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Moral Together — Projects Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Code+Pro:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/brands.min.css" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <img class="splash-logo" src="MoralTogetherLogo.png?v=2" alt="" />
    <div class="splash-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="splash-bar-fill"></span>
    </div>
  </div>

  <div class="page-shell">
    <div class="color-ribbon" aria-hidden="true"></div>
    <div class="gradient-orb orb-one"></div>
    <div class="gradient-orb orb-two"></div>
    <div class="gradient-orb orb-three"></div>

    <main class="profile-card" aria-labelledby="page-title">
      <nav class="language-switcher" aria-label="Language switcher">
        <span class="lang-slider" aria-hidden="true"></span>
        <button class="lang-btn active" type="button" data-lang="en">EN</button>
        <button class="lang-btn" type="button" data-lang="he">עברית</button>
        <button class="lang-btn" type="button" data-lang="ru">RU</button>
      </nav>

      <section class="hero">
        <img
          class="brand-logo"
          src="MoralTogetherLogo.png?v=2"
          alt="Moral Together — Connecting for Goodwill"
        />
        <h1 id="page-title" data-i18n="title">Our projects</h1>
      </section>

      <!-- Featured projects: logo tile + social strip inside the same card -->
      <section class="featured" aria-label="Featured projects">
        <div class="feat">
          <a class="project-link tone-pink" href="https://m1-radio.com" aria-label="Open M1 Radio">
            <img class="project-logo" src="logos/m1-radio-logo.png" alt="" width="120" height="120" />
          </a>
          <!-- TODO: replace href="#" with the real M1 Radio social links -->
          <div class="socstrip">
            <a class="soc yt" href="#" aria-label="M1 Radio on YouTube" target="_blank" rel="noopener"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a>
            <a class="soc tt" href="#" aria-label="M1 Radio on TikTok" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></a>
            <a class="soc ig" href="#" aria-label="M1 Radio on Instagram" target="_blank" rel="noopener"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
            <a class="soc fb" href="#" aria-label="M1 Radio on Facebook" target="_blank" rel="noopener"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
          </div>
        </div>

        <div class="feat">
          <a class="project-link tone-sun" href="https://stageofstars.com" aria-label="Open Stage of Stars">
            <img class="project-logo" src="logos/stage-of-stars.png" alt="" width="120" height="120" />
          </a>
          <div class="socstrip">
            <a class="soc yt" href="https://www.youtube.com/@StageofStarsOfficial" aria-label="Stage of Stars on YouTube" target="_blank" rel="noopener"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a>
            <a class="soc tt" href="https://www.tiktok.com/@stageofstarsisrael" aria-label="Stage of Stars on TikTok" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></a>
            <a class="soc ig" href="https://www.instagram.com/stageofstarsisrael" aria-label="Stage of Stars on Instagram" target="_blank" rel="noopener"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
            <a class="soc fb" href="https://www.facebook.com/profile.php?id=61592269746522" aria-label="Stage of Stars on Facebook" target="_blank" rel="noopener"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
          </div>
        </div>
      </section>

      <section class="links" aria-label="Project links">
        <a class="project-link tone-blue" href="#" aria-label="Open Moral for Good">
          <img class="project-logo" src="logos/moral-for-good.png" alt="" width="120" height="120" />
        </a>

        <a class="project-link tone-violet" href="#" aria-label="Open Zuzim.cash">
          <img class="project-logo" src="logos/zuzim-cash-logo.png" alt="" width="120" height="120" />
        </a>

        <a class="project-link tone-pink" href="#" aria-label="Open Trust Mom">
          <img class="project-logo" src="logos/trust-mom.png" alt="" width="120" height="120" />
        </a>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer">© 2026 Moral Together.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
